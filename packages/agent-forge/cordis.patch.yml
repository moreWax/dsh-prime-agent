# The dsh-agent-forge bundle patch: inserts the agent-identity tools over the
# profile root. Users install with: dsh plugin --profile <name> add dsh-agent-forge
# Configuration lives on the row; see src/index.ts Config for every field.

- insert:
    - id: agent-forge
      name: dsh-agent-forge
      config:
        workspaceRoot: '~/agents'
        callbackPort: 8765
        # publicUrl: https://forge.example.example   # set me: must be reachable by github.com
        # org: my-org                                # auto-install new agent apps here
